[project]
name = "bird-retrieval"
version = "0.1.0"
description = "Cross-modal (audio / image / text) retrieval for birds: ImageBind + a fine-tuned projection head + FAISS + an LLM reasoning layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchvision>=0.17",
    "imagebind @ git+https://github.com/facebookresearch/ImageBind.git",
    "faiss-cpu>=1.8.0",
    # No upper bound: on Colab, forcing a numpy 1.x downgrade breaks ABI compatibility with the
    # numpy-2.x-compiled torch/scipy already baked into the image (ValueError: numpy.dtype size
    # changed). Let the resolver match whatever's already consistent in the target environment.
    "numpy>=1.24",
    "requests>=2.31",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# required because `imagebind` above is a git URL ("direct reference"), which hatchling
# rejects by default
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["birdcall"]
